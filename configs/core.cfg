"Core"
{
    "ServerLang"            "ru"        // Язык переводов по умолчанию || Default translations language
    "server_id"             "0"         // Уникальный ID сервера для сторонних плагинов (плагином не используется)
                                        // Unique server identifier for other plugins (unused here)

    "MenuType"              "0"         // Тип меню по умолчанию || Default menu type
                                        //   0 - Chat
                                        //   1 - HTML Center
                                        //   2 - HTML Center with WASD
                                        //   3 - Panorama (требует PanoramaMenu 1 || requires PanoramaMenu 1)
    "PanoramaMenu"          "1"         // Включить 4-й тип меню (Panorama) || Enable the 4th menu type (Panorama)
                                        //   0 - Disable (пункт полностью пропадает || option is hidden)
                                        //   1 - Enable
    "MenuFlashFix"          "0"         // Фикс мигания в меню (возможно нестабильно) || Fix for menu flashing (possibly unstable)
                                        //   0 - Disable
                                        //   1 - Enable
    "MenuTime"              "120"       // Время автозакрытия меню, сек || Menu auto-close time, sec

    "MenuChangeCommand"     "!menu"     // Команда открытия меню смены типа || Command to open the menu-type editor
    "AccessUserChangeType"  "1"         // Разрешить игроку менять тип меню (MenuChangeCommand) || Allow the user to change menu type
                                        //   0 - Disable
                                        //   1 - Enable

    "MenuAddon"             "0"         // Источник визуальных кнопок меню || Source of the menu's visual buttons
                                        //   0 - Site URL
                                        //   1 - Addon
    "MenuURL"               "pisex.online/module/buttons"   // URL кнопок (при MenuAddon 0) || Buttons URL (when MenuAddon 0)
    "StopingUser"           "0"         // Блокировать движение игрока при открытом меню || Freeze player movement while the menu is open
                                        //   0 - Disable
                                        //   1 - Enable
    "TimeoutInputMenu"      "200"       // Задержка между нажатиями клавиш меню, мс || Delay between menu key presses, ms

    "SettingsCommand"       "!settings" // Команда открытия меню настроек || Command to open the settings menu
                                        // Консольный аналог регистрируется автоматически: mm_settings
                                        // Console equivalent is auto-registered: mm_settings

    "AllowDisableNotify"    "1"         // Разрешить игрокам отключать уведомления через меню настроек || Allow players to disable toasts
                                        //   0 - Disable (пункт скрыт, уведомления всегда включены || option hidden, always on)
                                        //   1 - Enable
    "NotifyDisabledDefault" "0"         // Состояние уведомлений для новых игроков || Default notification state for new players
                                        //   0 - Notifications ON  (включены || on)
                                        //   1 - Notifications OFF (выключены || off)

    "sound_type"            "0"         // Тип звуков в меню || Menu sound type
                                        //   0 - Disable
                                        //   1 - Sound Event
                                        //   2 - play `sound`
    "sound_back"            ""          // Звук "назад"   || "back" sound
    "sound_next"            ""          // Звук "вперёд"  || "next" sound
    "sound_exit"            ""          // Звук "выход"   || "exit" sound
    "sound_select"          ""          // Звук "выбор"   || "select" sound
    "sound_move"            ""          // Звук "переход" || "move" sound

    "delay_auth_fail_kick"  "30"        // Через сколько секунд кикать неавторизованного игрока, 0 - не кикать
                                        // Seconds before kicking an unauthorized player, 0 - no kick
    "commands_eater"        "!,/"       // Префиксы команд, которые не показываются в чате (через запятую)
                                        // Command prefixes hidden from chat (comma-separated)
}
